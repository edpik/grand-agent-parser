name: Publish parser release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test the tagged source
        run: python -m unittest discover -s tests -v
      - name: Package and publish ZIP
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          ASSET_NAME="grand_agent_parser_${RELEASE_TAG#v}.zip"
          git archive --format=zip --prefix=grand_agent_parser/ "$RELEASE_TAG" -o "$ASSET_NAME"
          python -c 'import sys, zipfile; assert zipfile.ZipFile(sys.argv[1]).testzip() is None' "$ASSET_NAME"
          cp CHANGELOG.md "$RUNNER_TEMP/release-notes.md"
          printf '\n\nSHA-256 ZIP:\n```text\n' >> "$RUNNER_TEMP/release-notes.md"
          sha256sum "$ASSET_NAME" >> "$RUNNER_TEMP/release-notes.md"
          printf '```\n' >> "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" "$ASSET_NAME" --verify-tag \
            --title "$RELEASE_TAG — парсер GSDX, GSFX и XML ФСНБ" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
